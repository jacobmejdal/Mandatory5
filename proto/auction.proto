syntax = "proto3";
package auction;
option go_package ="github.com/jacobmejdal/Mandatory5/proto";

service Auction {
   rpc Bid (BidRequest) returns (BidReply);
   rpc Result (ResultRequest) returns (ResultReply);
   rpc Heartbeat (Empty) returns (Empty);
   rpc Update (BidRequest) returns (Empty);
}

message Empty{

}

message BidRequest {
int32 bidder = 1;
int32 amount = 2;
int64 id = 3;
}

message BidReply {
    enum ACK {
        FAIL = 0;
        SUCCESS = 1;
        EXCEPTION = 2;
    }
    ACK outcome = 1;
}

message ResultRequest {
   
}

message ResultReply {
    int32 highest_bidder = 1;
    int32 amount = 2;
    bool auction_over = 3;
}

